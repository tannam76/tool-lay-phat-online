<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
    content="Chánh điện online: nhập pháp danh, an tọa tụng kinh cùng mọi người, nghe nhạc thiền.">
  <meta name="theme-color" content="#0c0705">
  <meta property="og:title" content="Tịnh Tâm · Chánh Điện Online">
  <meta property="og:image" content="/assets/hall.jpg">
  <title>Tịnh Tâm · Chánh Điện Online</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
  <style>
    /* Layout: one 9:16 stage (the painted hall) letterboxed in the viewport; sprites drawn on a canvas over it; HUD in the stage's corners. Dark by design (night temple). */
    :root {
      --bg: #0c0705;
      --fg: #f1e3c8;
      --muted: #b59a76;
      --gold: #d9a441;
      --red: #8a2a1e;
      --panel: rgba(26, 14, 9, .84);
      --line: rgba(217, 164, 65, .38);
      --display: "Noto Serif", Georgia, "Times New Roman", serif;
      --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--body);
      overflow: hidden;
      padding-left: max(0px, env(safe-area-inset-left, 0px));
      padding-right: max(0px, env(safe-area-inset-right, 0px))
    }

    #wrap {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px)
    }

    #stage {
      position: relative;
      aspect-ratio: 9/16;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 80px rgba(0, 0, 0, .8)
    }

    @media (max-aspect-ratio:9/16) {
      #stage {
        width: 100%;
        height: auto
      }
    }

    #stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation
    }

    /* HUD lives inside the stage so it matches the 9:16 stream frame */
    .hud {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .hud * {
      pointer-events: auto
    }

    #top {
      top: 10px;
      left: 10px;
      right: 10px;
      justify-content: space-between;
      flex-wrap: wrap
    }

    #bottom {
      bottom: 10px;
      left: 10px;
      right: 10px;
      justify-content: space-between;
      flex-wrap: wrap
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      backdrop-filter: blur(6px);
      display: inline-flex;
      gap: 6px;
      align-items: center;
      min-width: 0
    }

    .chip b {
      font-family: var(--display);
      font-weight: 600;
      color: var(--gold)
    }

    .n {
      font-variant-numeric: tabular-nums
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .btn {
      background: var(--panel);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      backdrop-filter: blur(6px)
    }

    .btn:hover {
      border-color: var(--gold)
    }

    .btn:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px
    }

    .btn.primary {
      background: var(--red);
      border-color: #b8452f;
      color: #fff3dc;
      padding: 11px 20px;
      font-size: 15px;
      font-weight: 500
    }

    .btn.gift {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 10px;
      border-radius: 12px;
      min-width: 64px
    }

    .btn.gift small {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .04em
    }

    .btn.gift b {
      font-family: var(--display);
      color: var(--gold);
      font-size: 13px
    }

    #gifts {
      display: flex;
      gap: 6px
    }

    /* merit board */
    #board {
      position: absolute;
      right: 10px;
      top: 52px;
      z-index: 5;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      min-width: 150px;
      font-size: 12px;
      backdrop-filter: blur(6px)
    }

    #board h3 {
      margin: 0 0 4px;
      font-family: var(--display);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600
    }

    #board ol {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 2px
    }

    #board li span {
      float: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-left: 8px
    }

    /* chat feed (left, like a live) */
    #feed {
      position: absolute;
      left: 10px;
      bottom: 74px;
      z-index: 4;
      width: 48%;
      max-width: 230px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 25%);
      mask-image: linear-gradient(to bottom, transparent, #000 25%)
    }

    .msg {
      background: rgba(0, 0, 0, .45);
      border-radius: 10px;
      padding: 5px 9px;
      font-size: 12px;
      line-height: 1.35;
      max-width: 100%;
      min-width: 0;
      overflow-wrap: anywhere;
      animation: in .35s ease-out
    }

    .msg b {
      color: var(--gold);
      font-weight: 600
    }

    .msg.gift {
      background: rgba(138, 42, 30, .6);
      border: 1px solid rgba(217, 164, 65, .5)
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(6px)
      }
    }

    /* entry */
    #gate {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 35%, rgba(217, 164, 65, .16), rgba(12, 7, 5, .80) 62%);
      padding: 16px
    }

    #gate form {
      width: min(100%, 360px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px 20px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 13px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6)
    }

    #gate h1 {
      font-family: var(--display);
      font-weight: 600;
      font-size: 25px;
      margin: 0;
      color: var(--gold);
      text-wrap: balance
    }

    #gate p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55
    }

    label {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted)
    }

    input {
      font: inherit;
      font-size: 16px;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, .35);
      color: var(--fg);
      width: 100%;
      box-sizing: border-box
    }

    input::placeholder {
      color: #7d6a52
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .hint {
      font-size: 11px;
      color: var(--muted)
    }

    .seg {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .seg button {
      background: rgba(0, 0, 0, .3);
      border: 1px solid var(--line);
      color: var(--fg);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px
    }

    .seg button[aria-pressed="true"] {
      background: var(--red);
      border-color: #b8452f;
      color: #fff3dc
    }

    #toast {
      position: absolute;
      left: 50%;
      top: 14%;
      transform: translateX(-50%);
      z-index: 6;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 15px;
      font-family: var(--display);
      color: var(--gold);
      font-size: 14px;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
      max-width: 88%;
      text-align: center
    }

    #toast.show {
      opacity: 1
    }

    #chatBar {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 52px;
      z-index: 6;
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      backdrop-filter: blur(10px)
    }

    #chatInput {
      flex: 1;
      background: transparent;
      border: none;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--fg);
      outline: none;
      min-width: 0
    }

    #chatInput::placeholder {
      color: var(--muted);
      font-size: 11px
    }

    .btnQuickSkin {
      background: rgba(0, 0, 0, .35);
      border: 1px solid var(--line);
      color: var(--gold);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px
    }

    .btnQuickSkin:hover {
      background: rgba(217, 164, 65, .2);
      border-color: var(--gold)
    }

    .btnChatSend {
      background: var(--red);
      border: 1px solid #b8452f;
      color: #fff3dc;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600
    }

    @media (prefers-reduced-motion:reduce) {

      #toast,
      .msg {
        transition: none;
        animation: none
      }
    }
  </style>
  <style>
    :root {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-size: 14px
    }

    [hidden] {
      display: none !important
    }
  </style>
</head>

<body>

  <div id="wrap">
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="top" class="hud">
        <span class="chip" id="me" hidden><b id="meName"></b><span class="hint">đang tụng kinh</span></span>
        <span class="chip"><span class="n" id="count">0</span><span>phật tử</span></span>
      </div>
      <div id="board" hidden>
        <h3>Tấm lòng thành</h3>
        <ol id="boardList"></ol>
      </div>
      <div id="feed" aria-live="polite"></div>
      <div id="chatBar" hidden>
        <button type="button" class="btnQuickSkin" id="btnQuickMan" title="Đổi sang nhân vật Nam">👦 Nam</button>
        <button type="button" class="btnQuickSkin" id="btnQuickWoman" title="Đổi sang nhân vật Nữ">👧 Nữ</button>
        <input id="chatInput" maxlength="120" placeholder="Chat cầu an hoặc gõ nam, nữ, !nam, !nu để đổi hình…"
          autocomplete="off">
        <button type="button" class="btnChatSend" id="btnSendChat">Gửi</button>
      </div>
      <div id="bottom" class="hud">
        <span id="gifts" hidden>
          <button class="btn gift" data-coins="1" data-fx="petal"><b>Cánh sen</b><small>1 coin</small></button>
          <button class="btn gift" data-coins="5" data-fx="incense"><b>Dâng hương</b><small>5 coins</small></button>
          <button class="btn gift" data-coins="20" data-fx="lotus"><b>Hoa sen</b><small>20 coins</small></button>
          <button class="btn gift" data-coins="99" data-fx="bell"><b>Thỉnh chuông</b><small>99 coins</small></button>
        </span>
        <span class="row">
          <button class="btn" id="btnScene" hidden title="Đổi khung cảnh"><span>🛕 Trong Chánh Điện</span></button>
          <button class="btn" id="nextTrack" hidden title="Bài kế tiếp"><span id="nowPlaying">♪</span> ›</button>
          <button class="btn" id="mute" hidden aria-pressed="false">Tắt nhạc</button>
          <button class="btn" id="leave" hidden>Rời</button>
        </span>
      </div>
      <div id="toast" role="status"></div>
      <div id="gate">
        <form id="gateForm">
          <h1>Chánh Điện Online</h1>
          <p>Nhập pháp danh, chọn y phục rồi vào an tọa. Đây là bản thử để kiểm tra giao diện 2.5D: nút quà ở dưới mô
            phỏng donation TikTok.</p>
          <label for="dharma">Pháp danh</label>
          <input id="dharma" name="dharma" maxlength="20" autocomplete="nickname"
            placeholder="Ví dụ: Diệu Hạnh, Minh Tâm…" required>
          <label>Y phục</label>
          <div class="seg" id="skin">
            <button type="button" data-skin="man" aria-pressed="true">Nam áo lam</button>
            <button type="button" data-skin="woman" aria-pressed="false">Nữ áo lam</button>
            <button type="button" data-skin="granny" aria-pressed="false">Áo nâu</button>
          </div>
          <label>Khung cảnh</label>
          <div class="seg" id="scene">
            <button type="button" data-scene="hall" aria-pressed="true">🛕 Trong Chánh Điện</button>
            <button type="button" data-scene="outside" aria-pressed="false">🏯 Ngoài Chánh Điện</button>
            <button type="button" data-scene="courtyard" aria-pressed="false">🌳 Ngoài Sân Chùa</button>
            <button type="button" data-scene="bamboo" aria-pressed="false">🎋 Rừng Trúc</button>
          </div>
          <div class="row">
            <button type="submit" class="btn primary">Vào chánh điện</button>
            <span class="hint">Chạm vào chánh điện để tụng một câu.</span>
          </div>
          <div class="row">
            <span class="hint">Thực hiện bởi Vo Nam</span>
          </div>
          <div class="row">
            <span class="hint" id="voiceInfo">Đang tìm giọng đọc tiếng Việt…</span>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       2.5D hall: painted 9:16 background (Flow) + sprites on canvas.
       Stage space is 1080x1920; everything below is in that space.
       ========================================================== */
    const SW = 1080, SH = 1920;
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    const A = {};   // loaded images
    const ASSETS = {
      hall: 'assets/hall.jpg',
      scene_outside: 'assets/scene_outside.jpg',
      scene_courtyard: 'assets/scene_courtyard.jpg',
      scene_bamboo: 'assets/scene_bamboo.jpg',
      monk: 'assets/c_monk.png', nun: 'assets/c_nun.png', granny: 'assets/c_granny.png', man: 'assets/c_man.png', woman: 'assets/c_woman.png', child: 'assets/c_child.png',
      anim_man: 'assets/anim_man.png', anim_woman: 'assets/anim_woman.png', anim_granny: 'assets/anim_granny.png',
      lotus: 'assets/fx_lotus.png', halo: 'assets/fx_halo.png', bell: 'assets/fx_bell.png', incense: 'assets/fx_incense.png', petal: 'assets/fx_petal.png', mo: 'assets/fx_mo.png', banner: 'assets/fx_banner.png', scroll: 'assets/fx_scroll.png',
    };
    let loaded = 0; const total = Object.keys(ASSETS).length;
    for (const [k, src] of Object.entries(ASSETS)) { const im = new Image(); im.onload = () => { loaded++; }; im.onerror = () => { loaded++; console.warn('missing', src); }; im.src = src; A[k] = im; }

    /* ---- walk / sit-down sprite strips (8 frames: 0-3 walk from behind, 4-7 sitting down onto the cushion) ----
       seatH = height of the seated frame incl. cushion, used to match the static seated sprites (260px). */
    const ANIM = { man: { fw: 212, fh: 300, seatH: 210 }, woman: { fw: 212, fh: 300, seatH: 220 }, granny: { fw: 195, fh: 300, seatH: 222 } };
    const hasAnim = k => ANIM[k] && A['anim_' + k] && A['anim_' + k].naturalWidth > 0;

    /* ---- floor layout: the painting's cushions sit on a perspective floor from y≈1180 (back) to y≈1850 (front).
       We define our own seat grid in that trapezoid so sprites scale with depth. ---- */
    const FLOOR = { yTop: 1130, yBot: 1790, xHalfTop: 240, xHalfBot: 400 };   // half-width of the floor at top/bottom rows
    const ROWS = 6, COLS = 6, AISLE = 0.9;                                      // 36 seats, central aisle
    const seats = [];
    for (let r = 0; r < ROWS; r++) {
      const t = (r + .55) / ROWS;                      // 0 back → 1 front
      const y = FLOOR.yTop + (FLOOR.yBot - FLOOR.yTop) * t;
      const half = FLOOR.xHalfTop + (FLOOR.xHalfBot - FLOOR.xHalfTop) * t;
      const scale = .22 + .33 * t;                   // sprite scale by depth
      for (let c = 0; c < COLS; c++) {
        let u = (c - (COLS - 1) / 2) / ((COLS - 1) / 2);       // -1..1
        u += Math.sign(u) * AISLE / (COLS - 1);         // open the aisle
        seats.push({ x: SW / 2 + u * half, y, scale, r, c, taken: null, order: r * COLS + c });
      }
    }
    // fill from the front rows nearest the aisle first (so the stream always looks full near the camera)
    seats.sort((a, b) => (b.r - a.r) || (Math.abs(a.x - SW / 2) - Math.abs(b.x - SW / 2)));
    const DOOR = { x: SW / 2, y: SH + 120 };         // walk in from below the frame

    /* ---- visitors ---- */
    const visitors = [], fx = [], floaters = [];
    const SKINS = ['man', 'woman', 'granny', 'man', 'woman', 'nun', 'monk', 'child'];

    const NUM_SKINS = {
      '1': 'man',
      '2': 'woman',
      '3': 'granny',
      '4': 'monk',
      '5': 'nun',
      '6': 'child',
      '7': 'master'
    };

    function skinFromText(t) {
      if (!t) return null;
      const raw = String(t).trim();

      // 1. Phím số nhanh: 1, 2, 3... hoặc !1, #1, /1, đổi 1, chọn 2, số 3, nv 4...
      const singleNum = raw.match(/^[!/#]?[0]*([1-7])$/);
      if (singleNum) return NUM_SKINS[singleNum[1]];

      const numCmd = raw.match(/(?:đổi|doi|chọn|chon|số|so|nv|nhân vật|nhan vat)\s*([1-7])(?:$|[\s\.,!])/i);
      if (numCmd) return NUM_SKINS[numCmd[1]];

      // 2. Lệnh tiền tố: !nam, !nu, /nam, /nu, #nam, #nu...
      const cmdMatch = raw.match(/^([!/#])([a-zA-ZÀ-ỹ0-9_]+)/i);
      if (cmdMatch) {
        const cmd = cmdMatch[2].toLowerCase().normalize('NFC');
        if (['nam', 'man', 'trai', 'anh'].includes(cmd)) return 'man';
        if (['nu', 'nữ', 'woman', 'gai', 'gái', 'chi', 'chị'].includes(cmd)) return 'woman';
        if (['ba', 'bà', 'aonau', 'áo nâu', 'cu', 'cụ', 'granny'].includes(cmd)) return 'granny';
        if (['tieu', 'tiểu', 'chutieu', 'chú tiểu', 'be', 'bé', 'child'].includes(cmd)) return 'child';
        if (['su', 'sư', 'thay', 'thầy', 'suthay', 'sư thầy', 'monk'].includes(cmd)) return 'monk';
        if (['ni', 'nico', 'ni cô', 'suco', 'sư cô', 'nun'].includes(cmd)) return 'nun';
        if (['caotang', 'cao tăng', 'truti', 'trụ trì', 'master'].includes(cmd)) return 'master';
      }

      // Chuẩn hóa văn bản
      let s = ' ' + raw.toLowerCase().normalize('NFC') + ' ';
      // Thay thế cụm 'nam mô' / 'nam mo' bằng từ khác để từ 'nam' trong 'nam mô' không bị nhận nhầm thành nhân vật Nam
      s = s.replace(/\s+nam\s*m[oô]\s+/gi, ' niệm ');
      const w = s.replace(/[^\p{L}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
      if (!w) return null;

      const pad = ' ' + w + ' ';
      const hasWord = (...words) => words.some(k => pad.includes(' ' + k + ' '));
      const hasAny = (...phrases) => phrases.some(k => pad.includes(k));

      // Kiểm tra ý định đổi nhân vật
      const isIntent = hasAny('đổi', 'doi', 'chọn', 'chon', 'chuyển', 'chuyen', 'sang', 'qua', 'thành', 'thanh', 'làm', 'lam', 'muốn', 'muon', 'xin', 'nhân vật', 'nhan vat', 'nv', 'hình', 'hinh', 'avatar', 'lấy', 'lay', 'cho mình', 'cho em', 'cho con', 'em là', 'mình là', 'con là', 'tôi là');
      const isShort = w.split(' ').length <= 3;

      // Cao tăng / Trụ trì
      if (hasAny('cao tăng', 'cao tang', 'đại sư', 'dai su', 'trụ trì', 'tru tri')) {
        return 'master';
      }

      // Sư cô / Ni cô (kiểm tra trước Sư thầy)
      if (hasAny('ni cô', 'ni co', 'sư cô', 'su co', 'cô ni', 'co ni') || hasWord('ni')) {
        if (isIntent || isShort) return 'nun';
      }

      // Sư thầy / Thầy chùa
      if (hasAny('sư thầy', 'su thay', 'thầy chùa', 'thay chua') || (hasWord('sư', 'su', 'thầy', 'thay') && !hasAny('sư cô', 'su co'))) {
        if (isIntent || isShort) return 'monk';
      }

      // Chú tiểu
      if (hasAny('chú tiểu', 'chu tieu', 'tiểu đồng', 'tieu dong') || hasWord('tiểu', 'tieu', 'bé', 'be')) {
